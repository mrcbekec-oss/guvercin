<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Güvercin Besle 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#a8d8f0;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
.ov{position:fixed;color:#fff;text-shadow:0 2px 4px #0007;pointer-events:none}
#st{top:0;left:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;font-weight:700;font-size:16px;line-height:1.5}
#bar{width:140px;height:10px;border-radius:6px;background:#0005;overflow:hidden}
#bar i{display:block;height:100%;width:100%;background:#ffd24a}
#jr{top:0;right:0;margin:calc(10px + env(safe-area-inset-top,0px)) 10px 0 0;padding:8px 10px;background:#0006;border-radius:10px;font-size:12px;line-height:1.55;text-shadow:none}
#jr b{display:block;margin-bottom:2px;font-size:13px}
#jr span{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;border:1px solid #fff9}
#help,#tip{left:0;right:0;text-align:center;font-size:13px}
#help{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#tip{bottom:calc(46px + env(safe-area-inset-bottom,0px));font-weight:700;font-size:15px}
.b{position:fixed;border-radius:50%;background:#ffffff40;border:2px solid #fff9;color:#fff;display:none;align-items:center;justify-content:center;touch-action:none}
.b.on{background:#ffd24acc}
#th{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:88px;height:88px;font-size:36px}
#rn{right:calc(34px + env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px));width:58px;height:58px;font-size:22px}
#joy{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:#ffffff30;border:2px solid #fff8;display:none;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#fffd;pointer-events:none}
#xh{position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px;border:2px solid #fffc;border-radius:50%;pointer-events:none;box-sizing:border-box}
#jr{pointer-events:auto}#jr.c div{display:none}
#msg{top:20%;left:0;right:0;text-align:center;font-size:19px;font-weight:700;opacity:0;transition:opacity .3s;padding:0 14px}
#fd{right:calc(124px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:64px;height:64px;font-size:26px}
#fy{right:calc(124px + env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px));width:64px;height:64px;font-size:26px}
#tk{display:none!important;right:calc(124px + env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px));width:64px;height:64px;font-size:26px}
@media (pointer:coarse){#joy{display:block}.b{display:flex}#help{display:none}}
@media (max-width:520px){#jr{font-size:10px;padding:5px 7px}#st{font-size:14px}}
#end{position:fixed;inset:0;background:#000b;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px}
#end button{font-size:18px;padding:10px 26px;border:0;border-radius:10px;background:#ffd24a;font-weight:700}
</style></head><body>
<div class="ov" id="st"><div id="sc"></div><div id="sd">🌾 yem</div><div id="bar"><i></i></div><div id="ck" style="font-size:13px"></div></div>
<div class="ov" id="jr"></div>
<div class="ov" id="tip"></div>
<div class="ov" id="msg"></div>
<div class="ov" id="help">W/A/S/D: yürü · Shift: koş · E/Boşluk: yem saç · F: besle (yemlik ya da yakındaki kuş) · V: kuşları uçur · fare/ok tuşları: bak</div>
<div id="xh"></div>
<div id="joy"><div id="knob"></div></div>
<div class="b" id="th">🌾</div>
<div class="b" id="rn">🏃</div>
<div class="b" id="fd">🥣</div>
<div class="b" id="tk">🧺</div>
<div class="b" id="fy">🕊️</div>
<div id="end"><div style="font-size:54px">🕊️</div><h2 id="et"></h2><p>Bütün güvercin cinslerini kümeste çıkardın!</p><button onclick="location.reload()">Tekrar Oyna</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,R=Math.random,rr=(a,b)=>a+R()*(b-a);
const scene=new T.Scene();scene.background=new T.Color(0xa8d8f0);scene.fog=new T.Fog(0xa8d8f0,60,170);
const cam=new T.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);
const ren=new T.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(ren.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x70a060,.95));
const sun=new T.DirectionalLight(0xfff0cc,.65);sun.position.set(40,60,25);scene.add(sun);
const M=c=>new T.MeshLambertMaterial({color:c});
const mesh=(g,c,x=0,y=0,z=0)=>{const m=new T.Mesh(g,M(c));m.position.set(x,y,z);return m};
const BX=(w,h,d)=>new T.BoxGeometry(w,h,d),SP=(r,s=10)=>new T.SphereGeometry(r,s,s),CY=(a,b,h,s=10)=>new T.CylinderGeometry(a,b,h,s);
const obs=[];
// ---- zemin ve yollar
const gr=mesh(new T.PlaneGeometry(260,260),0x6fae5a);gr.rotation.x=-Math.PI/2;scene.add(gr);
for(const r of [0,Math.PI/2]){const p=mesh(new T.PlaneGeometry(6,130),0xcdbd90);p.rotation.x=-Math.PI/2;p.rotation.z=r;p.position.y=.02;scene.add(p)}
const ring=mesh(new T.RingGeometry(5,8.5,32),0xd8c9a0);ring.rotation.x=-Math.PI/2;ring.position.y=.03;scene.add(ring);
// ---- çeşme
scene.add(mesh(CY(3.6,3.8,.7,24),0x9aa0a8,0,.35,0));
scene.add(mesh(CY(3.2,3.2,.6,24),0x4aa8e0,0,.45,0));
scene.add(mesh(CY(.3,.4,2.4),0x9aa0a8,0,1.5,0));
const fw=mesh(SP(.6),0x8fd4ff,0,2.8,0);scene.add(fw);
obs.push({x:0,z:0,r:3.9});
// ---- yem tezgâhı
const SX=-11,SZ=-10;
const stand=new T.Group();stand.position.set(SX,0,SZ);
stand.add(mesh(BX(3.2,1,1.2),0xb5835a,0,.5,0));
for(let i=0;i<6;i++)stand.add(mesh(BX(.62,.12,2),i%2?0xffffff:0xd9433a,-1.55+i*.62,2.3,.3));
for(const x of [-1.5,1.5])stand.add(mesh(CY(.06,.06,2.3),0x555555,x,1.15,.9));
for(let i=0;i<4;i++)stand.add(mesh(BX(.35,.3,.3),0xf2c26b,-.9+i*.6,1.15,0));
scene.add(stand);obs.push({x:SX,z:SZ,r:2});
function spr(draw,w,h,sx,sy){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g);const t=new T.CanvasTexture(c);
const s=new T.Sprite(new T.SpriteMaterial({map:t,transparent:true,depthTest:false}));s.scale.set(sx,sy,1);s.renderOrder=10;return s}
const sign=spr(g=>{g.fillStyle='#000a';g.fillRect(0,0,320,80);g.fillStyle='#ffd24a';g.font='bold 40px system-ui';g.textAlign='center';g.fillText('🌾 YEM TEZGAHI',160,55)},320,80,4.5,1.1);
sign.position.set(SX,3.6,SZ);scene.add(sign);
// ---- ağaçlar, bankler, lambalar, çiçekler
const free=(x,z,m=3)=>!(Math.abs(x)<m+1||Math.abs(z)<m+1)&&Math.hypot(x,z)>9&&Math.hypot(x-SX,z-SZ)>5&&Math.hypot(x-18,z+16)>9;
for(let i=0,n=0;n<34&&i<400;i++){const x=rr(-62,62),z=rr(-62,62);if(!free(x,z)||obs.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+3))continue;n++;
const s=rr(.8,1.4),g=new T.Group();g.add(mesh(CY(.3,.45,3.4),0x7a5230,0,1.7,0));
const lc=[0x2f8a3c,0x3b9a46,0x5aa23a][n%3];g.add(mesh(SP(2),lc,0,4.3,0),mesh(SP(1.5),lc,.9,5.2,.3));g.scale.setScalar(s);g.position.set(x,0,z);scene.add(g);obs.push({x,z,r:.7*s})}
function bench(x,z,r){const g=new T.Group();g.add(mesh(BX(2,.1,.6),0x9a6b3c,0,.55,0),mesh(BX(2,.5,.1),0x9a6b3c,0,.9,-.3));
for(const s of [-.8,.8])g.add(mesh(BX(.1,.55,.5),0x444444,s,.28,0));g.position.set(x,0,z);g.rotation.y=r;scene.add(g)}
[[8,6,Math.PI],[-8,6,Math.PI],[8,-6,0],[-8,-6,0],[6,12,Math.PI/2],[-6,-18,-Math.PI/2],[16,5,Math.PI],[-18,-5,0]].forEach(a=>bench(...a));
[[6,6],[-6,6],[6,-6],[-6,-6],[20,3.5],[-20,3.5],[3.5,20],[3.5,-20]].forEach(([x,z])=>{scene.add(mesh(CY(.08,.1,4),0x333333,x,2,z),mesh(SP(.35),0xfff2b0,x,4.1,z))});
const fc=[0xff5a7a,0xffd24a,0xffffff,0xb06aff,0xff9a3a];
for(let i=0,n=0;n<90&&i<600;i++){const x=rr(-65,65),z=rr(-65,65);if(!free(x,z,2)||obs.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+1))continue;n++;
scene.add(mesh(SP(.18,6),fc[n%5],x,.2,z),mesh(CY(.02,.02,.2,4),0x2f7a2f,x,.1,z))}
// ---- şehir silueti ve bulutlar
for(let i=0;i<22;i++){const a=i/22*6.283,d=rr(88,105),h=rr(10,40),w=rr(8,16);
const b=mesh(BX(w,h,w),[0xd9826b,0xe8d28a,0xa7b9d6,0xc79fd6,0xe0e0e0][i%5],Math.cos(a)*d,h/2,Math.sin(a)*d);scene.add(b)}
const clouds=[];for(let i=0;i<9;i++){const g=new T.Group();for(let j=0;j<4;j++){const m=new T.Mesh(SP(rr(4,7),8),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9}));m.position.set(j*5,rr(-1,1),rr(-2,2));g.add(m)}
g.position.set(rr(-120,120),rr(45,65),rr(-120,120));scene.add(g);clouds.push(g)}
// ---- oyuncu (insan)
const pl=new T.Group();
const legL=new T.Group(),legR=new T.Group(),armL=new T.Group(),armR=new T.Group();
for(const [l,x] of [[legL,-.14],[legR,.14]]){l.position.set(x,.8,0);l.add(mesh(BX(.22,.8,.26),0x3b5b8a,0,-.4,0),mesh(BX(.24,.12,.4),0x3a2a1a,0,-.82,.06));pl.add(l)}
for(const [a,x] of [[armL,-.42],[armR,.42]]){a.position.set(x,1.5,0);a.add(mesh(BX(.18,.6,.2),0xe0643a,0,-.3,0),mesh(SP(.1,6),0xf1c9a0,0,-.65,0));pl.add(a)}
pl.add(mesh(BX(.62,.75,.36),0xe0643a,0,1.15,0),mesh(BX(.34,.4,.2),0x9a6b3c,0,1.1,-.28),mesh(SP(.23),0xf1c9a0,0,1.8,0));
pl.add(mesh(CY(.26,.26,.1),0xd9333a,0,2.0,0),mesh(BX(.3,.04,.22),0xd9333a,0,1.97,.22),mesh(SP(.03,5),0x222222,-.08,1.84,.21),mesh(SP(.03,5),0x222222,.08,1.84,.21));
scene.add(pl);pl.visible=false;
const P={x:0,z:-14};let head=0,pitch=0,psp=0,ssp=0,pw=0,thr=0,cd=0,seeds=40,jx=0,jy=0,runT=0;
scene.add(cam);const hand=new T.Group();hand.add(mesh(BX(.12,.12,.55),0xe0643a,0,0,.1),mesh(SP(.07,8),0xf1c9a0,0,0,-.2),mesh(SP(.05,6),0xe6b84a,0,.07,-.24));cam.add(hand);
// ---- güvercin cinsleri
const BR=[
{n:'Kaya Güvercini',b:0x8f98a8,h:0x6c7483,w:0x6a7487,k:0x3f9a8a},
{n:'Taklacı',b:0xf4f4f4,h:0xf4f4f4,w:0xb5703a,k:0xe6e6e6},
{n:'Posta Güvercini',b:0x5a6a8a,h:0x46547a,w:0x39455f,k:0x8a5ac0},
{n:'Süs Güvercini',b:0xffffff,h:0xffffff,w:0xf0f0f0,k:0xffffff,fan:1},
{n:'Gerdanlı Kumru',b:0xd9c3a0,h:0xe5d3b5,w:0xc2a67c,k:0xd9c3a0,col:1},
{n:'Kızıl Güvercin',b:0xa8442f,h:0x8a3424,w:0x7a2c1c,k:0xd98a30},
{n:'Siyah Güvercin',b:0x2a2a32,h:0x22222a,w:0x1c1c24,k:0x2fa07a}];
const NM=['Boncuk','Pamuk','Karabaş','Gümüş','Fındık','Duman','Zeytin','Bulut','Tarçın','Mercan','Çiko','Mısır','Badem','Paşa','Sultan','Lokum','Kestane','Ceylan','Şeker','Fıstık','Maviş','Kömür','Gölge','Bahar','Yıldız','Pırpır','Tombik','Çınar'];
function mkBird(br,male){const g=new T.Group(),body=new T.Group();body.position.y=.45;g.add(body);
const bd=mesh(SP(.5,12),br.b);bd.scale.set(1,.85,1.4);
body.add(bd,mesh(SP(.26),br.h,0,.42,.55),mesh(SP(.22,8),br.k,0,.26,.42));
const bk=mesh(new T.ConeGeometry(.07,.24,6),0xffb347,0,.38,.88);bk.rotation.x=Math.PI/2;body.add(bk);
for(const x of [-.13,.13])body.add(mesh(SP(.05,6),0xff7a00,x,.46,.76));
if(br.fan){for(let i=-3;i<=3;i++){const t=mesh(BX(.2,.05,.7),0xffffff,i*.17,.28,-.95);t.rotation.set(-.5,0,i*.22);body.add(t)}}
else body.add(mesh(BX(.4,.05,.6),br.w,0,.05,-.82));
if(br.col){const c=new T.Mesh(new T.TorusGeometry(.2,.04,6,12),M(0x222222));c.position.set(0,.3,.42);c.rotation.x=Math.PI/2.4;body.add(c)}
const mw=s=>{const w=new T.Group(),m=mesh(BX(.9,.05,.6),br.w,.45*s,0,-.1);w.add(m);w.position.set(.38*s,.18,0);body.add(w);return w};
const wl=mw(-1),wr=mw(1);
for(const x of [-.14,.14])g.add(mesh(CY(.025,.025,.4,5),0xe8736a,x,.22,0));
g.scale.setScalar(male?1.12:.95);return{g,body,wl,wr}}
const labs=[];
function drawLab(b){const g=b.lg;g.clearRect(0,0,400,120);g.fillStyle='rgba(15,25,35,.72)';g.fillRect(0,0,400,120);
g.font='bold 44px system-ui';const nm=b.name+' ',w1=g.measureText(nm).width,sy=b.male?'♂':'♀',w2=g.measureText(sy).width,x=(400-w1-w2)/2;
g.textAlign='left';g.fillStyle='#fff';g.fillText(nm,x,50);g.fillStyle=b.male?'#5cb8ff':'#ff7fb8';g.fillText(sy,x+w1,50);
g.font='28px system-ui';g.textAlign='center';g.fillStyle='#ffe9a8';g.fillText(b.br.n+(b.chick?' · yavru':'')+(b.fed?'  ♥'+b.fed:''),200,95);b.lt.needsUpdate=true}
const birds=[];
BR.forEach((br,bi)=>{for(let k=0;k<0;k++){const i=bi*4+k,male=k%2==0,o=mkBird(br,male);
const a=rr(0,6.28),d=rr(6,20);
const b={...o,br,male,name:NM[i],fed:0,x:Math.cos(a)*d,z:Math.sin(a)*d,y:0,h:rr(0,6.28),st:'idle',t:rr(0,2),tx:0,tz:0,vy:0,ph:rr(0,9),seed:null};
const c=document.createElement('canvas');c.width=400;c.height=120;b.lg=c.getContext('2d');b.lt=new T.CanvasTexture(c);
b.sp=new T.Sprite(new T.SpriteMaterial({map:b.lt,transparent:true,depthTest:false}));b.sp.scale.set(3.6,1.08,1);b.sp.position.y=1.9;b.sp.renderOrder=9;b.g.add(b.sp);
b.sh=mesh(new T.CircleGeometry(.5,12),0x000000);b.sh.rotation.x=-Math.PI/2;b.sh.material.transparent=true;b.sh.material.opacity=.28;scene.add(b.sh);
drawLab(b);scene.add(b.g);birds.push(b)}});
// ---- yemler, kalpler
const seedsA=[],hearts=[],sg=SP(.07,5),heartTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.font='52px system-ui';g.textAlign='center';g.fillStyle='#ff4466';g.fillText('♥',32,50);return new T.CanvasTexture(c)})();
function throwSeed(){if(seeds<=0||cd>0)return;cd=.35;thr=.35;seeds=Math.max(0,seeds-1);beep(240,.06);
const fx=Math.sin(head),fz=Math.cos(head);
for(let i=0;i<4;i++){const m=new T.Mesh(sg,M(0xe6b84a));m.scale.y=.7;const s={m,x:P.x+fx*.5,y:1.4,z:P.z+fz*.5,vx:fx*rr(3,5.5)+rr(-1.2,1.2),vy:rr(2.5,4)+pitch*4,vz:fz*rr(3,5.5)+rr(-1.2,1.2),land:0,life:30};scene.add(m);seedsA.push(s)}}
let AC;function beep(f,v){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.15);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.16)}catch(e){}}
// ---- günlük (HUD)
var EX=[],FOUND={};const jr=document.getElementById('jr');jr.onclick=()=>jr.classList.toggle('c');if(innerWidth<700)jr.classList.add('c');
function hud(){const n=Object.keys(FOUND).length;document.getElementById('sc').textContent='⭐ '+score+'  ·  Cins: '+n+'/'+BR.length;
document.getElementById('sd').textContent='🌾 Yem: '+Math.floor(seeds);document.querySelector('#bar i').style.width=seeds/40*100+'%';
jr.innerHTML='<b>📖 Kuş Defteri</b>'+BR.map(br=>{const f=birds.concat(EX).filter(b=>b.br==br).length;return '<div><span style="background:#'+br.b.toString(16).padStart(6,'0')+'"></span>'+(FOUND[br.n]?br.n+' ×'+f+' ✓':'??? (henüz çıkmadı)')+'</div>'}).join('');
if(n==BR.length&&!over){over=1;document.getElementById('et').textContent='Süre: '+((performance.now()-t0)/1000).toFixed(0)+' sn · Puan: '+score;document.getElementById('end').style.display='flex'}}
let score=0,over=0,t0=performance.now();hud();
// ---- kontroller
const K={};addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key==' ')e.preventDefault();AC&&AC.resume()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jid=null;
function jm(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=r.width/2-8,d=Math.hypot(dx,dy);if(d>m){dx*=m/d;dy*=m/d}knob.style.transform='translate('+dx+'px,'+dy+'px)';jx=dx/m;jy=-dy/m}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(e.pointerId);jm(e);e.preventDefault();AC&&AC.resume()});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
const je=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;knob.style.transform=''}};joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
const th=document.getElementById('th'),rn=document.getElementById('rn');
th.addEventListener('pointerdown',e=>{K.e=1;e.preventDefault();AC&&AC.resume()});['pointerup','pointerleave','pointercancel'].forEach(ev=>th.addEventListener(ev,()=>K.e=0));
rn.addEventListener('pointerdown',e=>{runT=!runT;rn.classList.toggle('on',!!runT);e.preventDefault()});
let lid=null,lx=0,ly=0;const cv=ren.domElement;
cv.addEventListener('pointerdown',e=>{lid=e.pointerId;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>{if(e.pointerId===lid)lid=null}));
cv.addEventListener('pointermove',e=>{if(e.pointerId===lid){head-=(e.clientX-lx)*.006;pitch=Math.max(-1.1,Math.min(1.1,pitch-(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY}});
// ---- güvercin davranışı
const turn=(b,a,dt,s=9)=>{b.h+=Math.atan2(Math.sin(a-b.h),Math.cos(a-b.h))*Math.min(1,s*dt)};
function eat(b,s){s.life=0;b.fed++;score+=10;b.st='eat';b.t=.9;b.seed=null;beep(520+rr(0,300),.03);drawLab(b);
const h=new T.Sprite(new T.SpriteMaterial({map:heartTex,transparent:true,depthTest:false}));h.scale.set(.8,.8,1);h.position.set(b.x,2.6,b.z);h.renderOrder=11;scene.add(h);hearts.push({h,t:1.3});hud()}
function updBird(b,dt){const dp=Math.hypot(b.x-P.x,b.z-P.z);b.ph+=dt;if(b.hand>0)b.hand-=dt;
if(b.st!='fly'&&!(b.hand>0)&&dp<(Math.abs(psp)>6?5.5:1.7)){b.st='fly';b.t=rr(2.2,3.8);b.h=Math.atan2(b.x-P.x,b.z-P.z)+rr(-.7,.7);b.seed=null}
const fly=b.st=='fly';let fl=0,pk=0;
if(fly){b.t-=dt;b.x+=Math.sin(b.h)*8*dt;b.z+=Math.cos(b.h)*8*dt;
if(b.t>0)b.y+=(rr(3,4.5)-b.y)*2*dt;else{b.y=Math.max(0,b.y-4*dt);if(b.y==0){b.st='idle';b.t=rr(.5,2)}}
fl=Math.sin(b.ph*30)*.95;b.body.rotation.x=-.25}
else{b.body.rotation.x=0;
if(b.st!='go'&&b.st!='eat'){let best=null,bd=14;for(const s of seedsA)if(s.land&&s.life>0){const d=Math.hypot(s.x-b.x,s.z-b.z);if(d<bd&&!inRun(s.x,s.z)){bd=d;best=s}}if(best){b.st='go';b.seed=best}}
if(b.st=='go'){const s=b.seed;if(!s||s.life<=0){b.st='idle';b.t=.5}else{const d=Math.hypot(s.x-b.x,s.z-b.z);turn(b,Math.atan2(s.x-b.x,s.z-b.z),dt);b.x+=Math.sin(b.h)*4.2*dt;b.z+=Math.cos(b.h)*4.2*dt;pk=Math.abs(Math.sin(b.ph*14))*.1;if(d<.5)eat(b,s)}}
else if(b.st=='eat'){b.t-=dt;b.body.rotation.x=.6*Math.abs(Math.sin(b.ph*12));if(b.t<=0){b.st='idle';b.t=rr(.3,1.5)}}
else if(b.st=='idle'){b.t-=dt;b.body.rotation.x=(Math.sin(b.ph*3)>.8?.5:0);if(b.t<=0){b.st='walk';b.t=rr(1.5,3.5);b.tx=b.x+rr(-6,6);b.tz=b.z+rr(-6,6)}}
else if(b.st=='walk'){b.t-=dt;turn(b,Math.atan2(b.tx-b.x,b.tz-b.z),dt,5);b.x+=Math.sin(b.h)*1.7*dt;b.z+=Math.cos(b.h)*1.7*dt;pk=Math.abs(Math.sin(b.ph*10))*.06;if(b.t<=0){b.st='idle';b.t=rr(1,3)}}}
b.x=Math.max(-62,Math.min(62,b.x));b.z=Math.max(-62,Math.min(62,b.z));
const fd=Math.hypot(b.x,b.z);if(fd<4&&b.y<2){b.x*=4/fd;b.z*=4/fd}outRect(b);
b.wl.rotation.z=fl;b.wr.rotation.z=-fl;b.body.position.y=.45+pk;
b.g.position.set(b.x,b.y,b.z);b.g.rotation.y=b.h;b.sh.position.set(b.x,.04,b.z);b.sh.scale.setScalar(Math.max(.3,1-b.y*.15));
b.sp.visible=dp<30}

const CX=18,CZ=-16,RX0=CX-4,RX1=CX+4,RZ0=CZ-5,RZ1=CZ+5,FX=CX,FZ=CZ+1.5,WD=0x9a6b3c;

function post(x,z){scene.add(mesh(BX(.12,1.1,.12),WD,x,.55,z));obs.push({x,z,r:.32})}
function rail(x0,z0,x1,z1){const l=Math.hypot(x1-x0,z1-z0),a=Math.atan2(z1-z0,x1-x0);for(const y of [.45,.9]){const m=mesh(BX(l,.07,.05),WD,(x0+x1)/2,y,(z0+z1)/2);m.rotation.y=-a;scene.add(m)}}
for(let z=RZ0;z<=RZ1+.01;z+=.8){post(RX0,z);post(RX1,z)}
for(let x=RX0;x<=RX1+.01;x+=.8){if(Math.abs(x-CX)>1.3)post(x,RZ1);if(Math.abs(x-CX)>2.7)post(x,RZ0)}
rail(RX0,RZ0,RX0,RZ1);rail(RX1,RZ0,RX1,RZ1);rail(RX0,RZ1,CX-1.3,RZ1);rail(CX+1.3,RZ1,RX1,RZ1);rail(RX0,RZ0,CX-2.6,RZ0);rail(CX+2.6,RZ0,RX1,RZ0);

for(let x=CX-2.6;x<=CX+2.61;x+=.7)sol(x,RZ0);for(let z=RZ0;z<=RZ0+3;z+=.7){sol(CX-2.6,z);sol(CX+2.6,z)}
scene.add(mesh(BX(5.2,2.6,.2),WD,CX,1.3,RZ0),mesh(BX(.2,2.6,3),WD,CX-2.6,1.3,RZ0+1.5),mesh(BX(.2,2.6,3),WD,CX+2.6,1.3,RZ0+1.5),mesh(BX(5.2,.05,3),0xc9a86a,CX,.03,RZ0+1.5));
const roof=mesh(BX(6,.15,4),0xb5483a,CX,2.8,RZ0+1.4);roof.rotation.x=.1;scene.add(roof);
for(const s of [-2.6,2.6])scene.add(mesh(CY(.08,.08,2.7),WD,CX+s,1.35,RZ0+3));
const perch=mesh(CY(.05,.05,4.4),0x7a5230,CX,1.2,RZ0+2);perch.rotation.z=Math.PI/2;scene.add(perch);
for(let i=-1;i<=1;i++)scene.add(mesh(BX(.9,.4,.6),WD,CX+i*1.6,.2,RZ0+.5),mesh(BX(.7,.1,.45),0xe6c86a,CX+i*1.6,.42,RZ0+.5));
scene.add(mesh(BX(1.8,.28,.55),0x7a5230,FX,.14,FZ),mesh(CY(.35,.3,.15,12),0x4aa8e0,CX+2.6,.08,FZ));

const cs=spr(g=>{g.fillStyle='#000a';g.fillRect(0,0,320,80);g.fillStyle='#ffd24a';g.font='bold 40px system-ui';g.textAlign='center';g.fillText('🏠 KÜMES',160,55)},320,80,4.2,1.05);cs.position.set(CX,4.4,RZ0+1.5);scene.add(cs);
function outRect(b){if(b.y>2)return;const m=.6;if(b.x>RX0-m&&b.x<RX1+m&&b.z>RZ0-m&&b.z<RZ1+m){const d=[b.x-(RX0-m),RX1+m-b.x,b.z-(RZ0-m),RZ1+m-b.z],i=d.indexOf(Math.min(...d));if(i==0)b.x=RX0-m;else if(i==1)b.x=RX1+m;else if(i==2)b.z=RZ0-m;else b.z=RZ1+m}}
const extra=EX,CN=['Tüy','Kırıntı','Pıt','Çıtır','Cin','Zıpzıp','Mini','Fırfır','Pofuduk','Tombul','Bal','Kiraz','Nane','Limon','Yaprak','Minnoş'];

function mkB(br,male,name,x,z){FOUND[br.n]=1;const o=mkBird(br,male);const b={...o,br,male,name,fed:0,x,z,y:0,h:rr(0,6.28),st:'idle',t:rr(0,2),tx:0,tz:0,vy:0,ph:rr(0,9),seed:null,own:true,hu:rr(0,8),grow:0,chick:false};

b.sp=new T.Sprite(new T.SpriteMaterial({map:b.lt,transparent:true,depthTest:false}));b.sp.scale.set(3.6,1.08,1);b.sp.position.y=1.9;b.sp.renderOrder=9;b.g.add(b.sp);

extra.push(mkB(BR[0],true,'Çakıl',CX-1,CZ+3),mkB(BR[0],false,'Nar',CX+1,CZ+2),mkB(BR[1],false,'Mavi',CX+2,CZ+3));
msg('🏠 Kümesin hazır, 3 kuşun var! Yemliğe yem koy (F)');hud();
function updOwn(b,dt){b.ph+=dt;const dp=Math.hypot(b.x-P.x,b.z-P.z);let fl=0,pk=0,gs=b.male?1.12:.95;
if(b.chick){b.grow+=dt*(feeder>0?1:.25);gs*=.5+.5*Math.min(1,b.grow/60);if(b.grow>=60){b.chick=false;drawLab(b);msg('🐥 '+b.name+' büyüdü!')}}
b.g.scale.setScalar(gs);b.sp.scale.set(3.6/gs,1.08/gs,1);b.sp.position.y=1.9/gs;
if(b.st=='out'){b.t-=dt;const cx=CX-b.x,cz=CZ-b.z;if(Math.hypot(cx,cz)>12)turn(b,Math.atan2(cx,cz),dt,2);else b.h+=Math.sin(b.ph*.7+b.sv)*1.1*dt;b.x+=Math.sin(b.h)*6*dt;b.z+=Math.cos(b.h)*6*dt;b.y+=(b.ty-b.y)*2*dt;fl=Math.sin(b.ph*30)*.95;b.body.rotation.x=-.25;if(b.t<=0){b.st='home';b.tx=CX+rr(-2,2);b.tz=RZ0+rr(.9,2.3)}}
else if(b.st=='home'){const d=Math.hypot(b.tx-b.x,b.tz-b.z),sp=d>4?7:Math.max(1.5,d*1.2);turn(b,Math.atan2(b.tx-b.x,b.tz-b.z),dt,6);b.x+=Math.sin(b.h)*sp*dt;b.z+=Math.cos(b.h)*sp*dt;
if(d>4)b.y+=(3.2-b.y)*2*dt;else b.y=Math.max(0,b.y-3.5*dt);fl=Math.sin(b.ph*30)*.95;b.body.rotation.x=-.25;if(b.y<=.05&&d<3){b.y=0;b.st='idle';b.t=1}}
else{b.body.rotation.x=0;b.hu+=dt;b.t-=dt;
if(b.st=='eatF'){const d=Math.hypot(b.tx-b.x,b.tz-b.z);turn(b,Math.atan2(b.tx-b.x,b.tz-b.z),dt);b.x+=Math.sin(b.h)*3*dt;b.z+=Math.cos(b.h)*3*dt;pk=Math.abs(Math.sin(b.ph*14))*.1;if(d<.4){b.st='peck';b.t=1.2}}
else if(b.st=='go'){const s=b.seed;if(!s||s.life<=0){b.st='idle';b.t=.5}else{const d=Math.hypot(s.x-b.x,s.z-b.z);turn(b,Math.atan2(s.x-b.x,s.z-b.z),dt);b.x+=Math.sin(b.h)*3.5*dt;b.z+=Math.cos(b.h)*3.5*dt;pk=Math.abs(Math.sin(b.ph*14))*.1;if(d<.45){eat(b,s);b.hu=0}}}
else if(b.st=='peck'){b.body.rotation.x=.6*Math.abs(Math.sin(b.ph*12));if(b.t<=0){if(feeder>=1){feeder-=1;b.hu=0}b.st='idle';b.t=rr(1,3)}}
else if(b.st=='eat'){b.body.rotation.x=.6*Math.abs(Math.sin(b.ph*12));if(b.t<=0){b.st='idle';b.t=rr(.5,1.5)}}
else if(b.st=='idle'){b.body.rotation.x=(Math.sin(b.ph*3)>.85?.5:0);if(b.t<=0){b.st='walk';b.t=rr(1.5,3);b.tx=rr(RX0+.8,RX1-.8);b.tz=rr(RZ0+.8,RZ1-.8)}}
else if(b.st=='walk'){turn(b,Math.atan2(b.tx-b.x,b.tz-b.z),dt,5);b.x+=Math.sin(b.h)*1.6*dt;b.z+=Math.cos(b.h)*1.6*dt;pk=Math.abs(Math.sin(b.ph*10))*.06;if(b.t<=0){b.st='idle';b.t=rr(1,3)}}
if(b.st=='idle'||b.st=='walk'){let bs=null,bd=9;for(const s of seedsA)if(s.land&&s.life>0&&s.x>RX0+.5&&s.x<RX1-.5&&s.z>RZ0+.5&&s.z<RZ1-.5){const d=Math.hypot(s.x-b.x,s.z-b.z);if(d<bd){bd=d;bs=s}}if(bs){b.st='go';b.seed=bs}}
if(b.hu>14&&feeder>=1&&(b.st=='idle'||b.st=='walk')){b.st='eatF';b.tx=FX+rr(-.7,.7);b.tz=FZ-.6}
b.x=Math.max(RX0+.5,Math.min(RX1-.5,b.x));b.z=Math.max(RZ0+.5,Math.min(RZ1-.5,b.z))}
b.wl.rotation.z=fl;b.wr.rotation.z=-fl;b.body.position.y=.45+pk;b.g.position.set(b.x,b.y,b.z);b.g.rotation.y=b.h;b.sh.position.set(b.x,.04,b.z);b.sh.scale.setScalar(Math.max(.3,1-b.y*.15)*gs);b.sp.visible=dp<30}
function coopTick(dt){if(msgT>0){msgT-=dt;if(msgT<=0)document.getElementById('msg').style.opacity=0}
const list=birds.filter(b=>b.own).concat(extra),ad=list.filter(b=>!b.chick&&b.st!='home'),ml=ad.filter(b=>b.male),fl=ad.filter(b=>!b.male);
const gl=list.filter(b=>b.y<.3&&b.st!='home'&&b.st!='out');
for(let i=0;i<gl.length;i++){const a=gl[i],px=a.x-P.x,pz=a.z-P.z,pd=Math.hypot(px,pz);if(pd<1.1&&pd>.001){const k=1.1-pd;a.x+=px/pd*k*.5;a.z+=pz/pd*k*.5}
for(let j=i+1;j<gl.length;j++){const c=gl[j];let dx=c.x-a.x,dz=c.z-a.z,d=Math.hypot(dx,dz);const m=(a.chick?.3:.55)+(c.chick?.3:.55);if(d<m){if(d<.001){dx=rr(-1,1);dz=1;d=Math.hypot(dx,dz)}const k=(m-d)/2;a.x-=dx/d*k;a.z-=dz/d*k;c.x+=dx/d*k;c.z+=dz/d*k}}}
if(ml.length&&fl.length&&feeder>=3&&eggs.length<3&&list.length<14){lay-=dt;if(lay<=0){lay=rr(18,25);feeder-=3;const ni=[0,1,2].find(i=>!eggs.some(e=>e.n==i)),par=R()<.5?ml[0|R()*ml.length]:fl[0|R()*fl.length];
const m=mesh(SP(.13),0xffffff,CX+(ni-1)*1.6,.52,RZ0+.5);m.scale.set(1,1.3,1);scene.add(m);eggs.push({m,n:ni,t:18,br:R()<.3?BR[0|R()*BR.length]:par.br});msg('🥚 Kümeste yumurta var!')}}
for(let i=eggs.length-1;i>=0;i--){const e=eggs[i];e.t-=dt;e.m.rotation.z=e.t<4?Math.sin(e.t*14)*.25:0;if(e.t<=0){scene.remove(e.m);const c=mkB(e.br,R()<.5,CN[cn++%CN.length],CX+(e.n-1)*1.6,RZ0+1);c.chick=true;drawLab(c);extra.push(c);eggs.splice(i,1);hud();msg('🐣 Yavru çıktı: '+c.name+(c.male?' ♂':' ♀'))}}
grain.scale.y=Math.max(.05,feeder/30);grain.position.y=.28+.1*grain.scale.y;
const ch=list.filter(b=>b.chick).length,t='🏠 Kümes: '+list.length+' kuş'+(ch?' ('+ch+' yavru)':'')+(eggs.length?' · 🥚'+eggs.length:'')+' · 🥣 '+Math.floor(feeder)+'/30';
if(t!=ckT){ckT=t;document.getElementById('ck').textContent=t}}
function actFeed(){AC&&AC.resume();
if(Math.hypot(P.x-FX,P.z-FZ)<3.4&&feeder<29.5){if(seeds<1){msg('Yemin yok! Tezgâha git 🌾');return}if(feeder>=30){msg('Yemlik dolu 🥣');return}const a=Math.min(10,Math.floor(seeds),30-Math.floor(feeder));seeds-=a;feeder+=a;beep(400,.04);msg('🥣 Yemliğe '+a+' yem koydun');hud();return}
let nb=null,nd=3.2;for(const b of birds.concat(extra)){if(b.st=='fly'||b.st=='home')continue;const d=Math.hypot(b.x-P.x,b.z-P.z);if(d<nd){nd=d;nb=b}}
if(!nb){msg('Yakında kuş yok. Bir kuşa yaklaş ya da yemliğe git');return}
if(seeds<1){msg('Yemin bitti! Tezgâha git 🌾');return}
seeds-=1;nb.hand=4;eat(nb,{life:1});msg('✋ '+nb.name+' elinden yedi')}
function actTake(){return;let nb=null,nd=3.6;for(const b of birds){if(b.own||b.st=='fly')continue;const d=Math.hypot(b.x-P.x,b.z-P.z);if(d<nd){nd=d;nb=b}}
if(!nb){msg('Yakında alınacak kuş yok');return}
if(birds.filter(b=>b.own).length+extra.length>=14){msg('Kümes dolu!');return}
if(nb.fed<2){msg(nb.name+' henüz güvenmiyor: ♥'+nb.fed+'/2 (önce besle)');return}
nb.own=true;nb.st='home';nb.tx=CX+rr(-2,2);nb.tz=CZ+rr(-1,2);nb.hu=rr(0,8);nb.grow=0;nb.chick=false;msg('🏠 '+nb.name+' kümese gidiyor')}
const fdB=document.getElementById('fd'),tkB=document.getElementById('tk');
fdB.addEventListener('pointerdown',e=>{actFeed();e.preventDefault()});tkB.addEventListener('pointerdown',e=>{actTake();e.preventDefault()});
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k=='f')actFeed();if(k=='g')actTake()});
function actFly(){AC&&AC.resume();let n=0;for(const b of birds.filter(b=>b.own).concat(extra)){if(b.chick||b.st=='out'||b.st=='home')continue;b.st='out';b.t=rr(4,7);b.h=rr(0,6.28);b.ty=rr(3,5);b.sv=rr(0,6);n++}msg(n?'🕊️ Kuşlar uçtu, birazdan yuvalarına dönecek!':'Uçacak kuş yok (yavrular uçamaz)');if(n)beep(300,.04)}
document.getElementById('fy').addEventListener('pointerdown',e=>{actFly();e.preventDefault()});
addEventListener('keydown',e=>{if(!e.repeat&&e.key.toLowerCase()=='v')actFly()});
const clock=new T.Clock();let help=14;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);
if(K.arrowleft)head+=2.3*dt;if(K.arrowright)head-=2.3*dt;if(K.arrowup)pitch=Math.min(1.1,pitch+1.5*dt);if(K.arrowdown)pitch=Math.max(-1.1,pitch-1.5*dt);
const mv=Math.max(-1,Math.min(1,(K.w?1:0)-(K.s?.6:0)+jy)),sv=Math.max(-1,Math.min(1,(K.d?1:0)-(K.a?1:0)+jx)),run=(K.shift||runT)?1.8:1;
psp+=(mv*4.5*run-psp)*Math.min(1,9*dt);ssp+=(sv*4*run-ssp)*Math.min(1,9*dt);
let nx=P.x+Math.sin(head)*psp*dt-Math.cos(head)*ssp*dt,nz=P.z+Math.cos(head)*psp*dt+Math.sin(head)*ssp*dt;
for(const o of obs){const d=Math.hypot(nx-o.x,nz-o.z),m=o.r+.4;if(d<m){nx=o.x+(nx-o.x)/d*m;nz=o.z+(nz-o.z)/d*m}}
P.x=Math.max(-64,Math.min(64,nx));P.z=Math.max(-64,Math.min(64,nz));
pw+=dt*Math.hypot(psp,ssp)*2;const sw=Math.sin(pw)*.8*Math.min(1,Math.abs(psp)/3);
legL.rotation.x=sw;legR.rotation.x=-sw;armL.rotation.x=-sw*.8;armR.rotation.x=sw*.8;
cd-=dt;let ta=0;if(thr>0){thr-=dt;ta=Math.sin(Math.min(1,(.35-thr)/.35)*Math.PI)}hand.rotation.x=.25-ta*1.1;hand.position.set(.34,-.3+ta*.1,-.55-ta*.25);
if(K.e||K[' '])throwSeed();
pl.position.set(P.x,0,P.z);pl.rotation.y=head;
if(Math.hypot(P.x-SX,P.z-SZ)<5){if(seeds<40){seeds=Math.min(40,seeds+25*dt);hud();document.getElementById('tip').textContent='🌾 Yem dolduruluyor…'}else document.getElementById('tip').textContent='🌾 Torban dolu'}
else if(seeds<=0)document.getElementById('tip').textContent='Yemin bitti! Tezgâha git 🌾';else document.getElementById('tip').textContent='';
for(const s of seedsA){if(s.life<=0){if(s.m.parent)scene.remove(s.m);continue}s.life-=dt;if(!s.land){s.vy-=12*dt;s.x+=s.vx*dt;s.z+=s.vz*dt;s.y+=s.vy*dt;if(s.y<=.08){s.y=.08;s.land=1}}
s.m.position.set(s.x,s.y,s.z);if(s.life<=0)scene.remove(s.m)}
for(const b of birds)b.own?updOwn(b,dt):updBird(b,dt);for(const b of extra)updOwn(b,dt);coopTick(dt);
for(let i=hearts.length-1;i>=0;i--){const h=hearts[i];h.t-=dt;h.h.position.y+=dt*1.2;h.h.material.opacity=Math.min(1,h.t);if(h.t<=0){scene.remove(h.h);hearts.splice(i,1)}}
for(const c of clouds){c.position.x+=dt*1.5;if(c.position.x>140)c.position.x=-140}
fw.scale.setScalar(1+Math.sin(performance.now()/300)*.12);
if(help>0){help-=dt;if(help<=0)document.getElementById('help').style.display='none'}
const sp2=Math.min(1,Math.hypot(psp,ssp)/3),cp2=Math.cos(pitch);cam.position.set(P.x,1.65+Math.sin(pw*1.1)*.05*sp2,P.z);cam.lookAt(P.x+Math.sin(head)*cp2,cam.position.y+Math.sin(pitch),P.z+Math.cos(head)*cp2);
ren.render(scene,cam)}
loop();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
